{
  "media": [
    {
      "name": "uploads",
      "label": "Your photo library",
      "input": "assets/uploads",
      "output": "/assets/uploads",
      "extensions": [
        "jpg",
        "jpeg",
        "png",
        "webp"
      ],
      "rename": "random"
    }
  ],
  "settings": {
    "content": {
      "merge": true
    }
  },
  "content": [
    {
      "name": "home",
      "label": "Homepage",
      "type": "file",
      "path": "content/home.json",
      "format": "json",
      "fields": [
        {
          "name": "heroTitle",
          "label": "Main headline",
          "type": "string"
        },
        {
          "name": "heroEmphasis",
          "label": "Highlighted headline",
          "type": "string"
        },
        {
          "name": "heroDescription",
          "label": "Introduction",
          "type": "text"
        },
        {
          "name": "heroImage",
          "label": "Upload homepage hero",
          "type": "image",
          "options": {
            "media": "uploads"
          }
        },
        {
          "name": "heroAlt",
          "label": "Describe the hero photo",
          "type": "string"
        },
        {
          "name": "heroCaption",
          "label": "Hero location caption",
          "type": "string"
        },
        {
          "name": "departureSlugs",
          "label": "Departure card trip IDs",
          "type": "string",
          "list": true
        },
        {
          "name": "featuredSlugs",
          "label": "Featured trip IDs",
          "type": "string",
          "list": true
        }
      ]
    },
