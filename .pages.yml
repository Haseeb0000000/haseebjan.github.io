        "primary": "name",
        "fields": [
          "name",
          "region",
          "type",
          "price"
        ],
        "sort": "order"
      },
      "fields": [
        {
          "name": "slug",
          "label": "Page ID",
          "type": "string",
          "readonly": true
        },
        {
          "name": "name",
          "label": "Trip title",
          "type": "string",
          "required": true
        },
        {
          "name": "region",
          "label": "Destination",
          "type": "select",
          "options": {
            "values": [
              "Kashmir",
              "Ladakh",
              "Jammu",
              "Kashmir & Ladakh"
            ]
          }
        },
        {
          "name": "type",
          "label": "Travel style",
          "type": "select",
          "options": {
            "values": [
              "Group",
              "Women-only",
              "Private",
              "Trek",
              "Day trip",
              "Motorcycle",
              "Pilgrimage"
